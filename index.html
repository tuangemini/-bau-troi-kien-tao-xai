

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bầu Trời Kiến Tạo Cuộc Sống xAI - Control &amp; Attendance Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #030712;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-card: rgba(56, 189, 248, 0.3);
            --accent-cyan: #00f2fe;
            --accent-blue: #38bdf8;
            --accent-gold: #fbbf24;
            --accent-green: #4ade80;
            --accent-purple: #c084fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            position: relative;
            overflow-x: hidden;
        }

        .stars-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #030712 100%);
            overflow: hidden;
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration, 3s) infinite ease-in-out;
            opacity: var(--opacity, 0.8);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #00f2fe; }
        }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }
        header { padding: 45px 0 25px; text-align: center; }

        .badge-commander {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.08));
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: var(--accent-gold);
            padding: 8px 20px; border-radius: 999px;
            font-size: 0.95rem; font-weight: 700; margin-bottom: 18px;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.2);
        }

        h1.main-title {
            font-size: 3rem; font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #00f2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 14px; letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .subtitle { color: var(--text-muted); font-size: 1.15rem; max-width: 750px; margin: 0 auto 28px; line-height: 1.6; }

        .banner-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px; margin-bottom: 35px;
        }

        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border-card);
            backdrop-filter: blur(16px); border-radius: 18px; padding: 22px;
            display: flex; align-items: center; gap: 16px; transition: all 0.3s ease;
        }

        .stat-icon {
            width: 50px; height: 50px; border-radius: 14px;
            background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
        }

        .stat-info h4 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-info .val { font-size: 1.45rem; font-weight: 700; color: #fff; margin-top: 4px; }

        .register-banner {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(56, 189, 248, 0.05));
            border: 1px solid rgba(0, 242, 254, 0.5); border-radius: 18px;
            padding: 22px 30px; margin-bottom: 40px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
        }

        .zoom-widget {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.85));
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .zoom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: center;
        }

        @media (max-width: 768px) { .zoom-grid { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-checkin {
            padding: 14px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none; border-radius: 10px; color: #000; font-weight: 700;
            font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
            transition: all 0.3s;
        }

        .btn-checkin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
        }

        .leaderboard-container {
            background: var(--bg-card); border: 1px solid var(--border-card);
            backdrop-filter: blur(16px); border-radius: 22px; padding: 28px; margin-bottom: 40px;
        }

        .leader-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
        .leader-item { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 18px; }

        .rank-badge {
            width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800;
        }
        .rank-1 { background: rgba(251, 191, 36, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .rank-2 { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid #cbd5e1; }
        .rank-3 { background: rgba(217, 119, 6, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }

        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe); border-radius: 999px; }

        .fleet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(370px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .chuyen-co-card { background: var(--bg-card); border: 1px solid var(--border-card); backdrop-filter: blur(16px); border-radius: 22px; padding: 26px; }

        .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .chuyen-co-title { font-size: 1.35rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }

        .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
        .pill-100 { background: rgba(74, 222, 128, 0.15); color: var(--accent-green); border: 1px solid rgba(74, 222, 128, 0.3); }

        .bdh-pair { background: rgba(192, 132, 252, 0.12); border: 1px dashed rgba(192, 132, 252, 0.4); color: var(--accent-purple); padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 14px; }
        .member-list { list-style: none; }
        .member-item { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; margin-bottom: 8px; background: rgba(15, 23, 42, 0.5); border-radius: 12px; font-size: 0.92rem; border: 1px solid rgba(255, 255, 255, 0.04); }

        .member-row-top { display: flex; align-items: center; justify-content: space-between; }
        .metrics-badges { display: flex; gap: 8px; font-size: 0.75rem; }
        .badge-metric.done { background: rgba(74, 222, 128, 0.15); color: #4ade80; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }

        .role-captain { color: var(--accent-gold); font-weight: 700; }
        .role-copilot { color: var(--accent-blue); font-weight: 600; }

        .table-container { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 22px; overflow: hidden; backdrop-filter: blur(16px); margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(30, 41, 59, 0.85); color: var(--accent-cyan); padding: 18px 22px; font-size: 0.95rem; text-transform: uppercase; }
        td { padding: 18px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; }

        .price-badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
        .price-de-nhat { background: rgba(251, 191, 36, 0.18); color: var(--accent-gold); }
        .price-chuyen-co { background: rgba(244, 63, 94, 0.18); color: #fb7185; }

        footer { text-align: center; padding: 35px 0; color: var(--text-muted); font-size: 0.92rem; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        footer a { color: var(--accent-cyan); text-decoration: none; }
    </style>
</head>
<body>
</body>
</html>
